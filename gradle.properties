kotlin.code.style=official

# Gradle perf
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true


# Keycloak target. Bumping the major usually requires re-validating the SPI
# usages in src/main/kotlin (BruteForceProtector, CredentialHelper, OTPCredentialModel, ...).
# The .jar produced is compatible with any 26.x runtime when this is set to a 26.x SPI.
keycloakVersion=26.0.6
